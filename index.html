<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Sign In</h1>

    <form id="login-form" autocomplete="off">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter username" required>

      <label for="password">Password</label>
      <div class="password-field">
        <input type="password" id="password" name="password" placeholder="Enter password" required>
        <button type="button" id="toggle-password" class="link-btn">Show</button>
      </div>

      <div class="button-row">
        <button type="submit" id="signin-btn" class="btn primary">Sign In</button>
        <button type="button" id="signout-btn" class="btn secondary" disabled>Sign Out</button>
      </div>
    </form>

    <p id="status-msg" class="status"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
