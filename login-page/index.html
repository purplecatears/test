<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-container">
    <h1>Login</h1>

    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" />

      <label for="password">Password</label>
      <div class="password-wrapper">
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" />
        <button type="button" id="togglePassword" class="toggle-btn">Show</button>
      </div>

      <div id="message" class="message"></div>

      <div class="button-group">
        <button type="submit" id="signInBtn" class="btn signin-btn">Sign In</button>
        <button type="button" id="signOutBtn" class="btn signout-btn" disabled>Sign Out</button>
      </div>
    </form>

    <div id="statusBar" class="status-bar">Status: Signed out</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
